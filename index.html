<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jevkray-captcha-v3 — live demo</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        background: radial-gradient(900px 500px at 50% -10%, #1b2334 0%, #0b0e14 55%, #07090d 100%);
        color: #e6ecf5; font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .wrap { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 18px; }
    header { border-bottom: 1px solid #1c2433; background: rgba(10,13,20,.7); position: sticky; top: 0; backdrop-filter: blur(6px); z-index: 5; }
    .nav-in { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 10px; flex-wrap: wrap; }
    .brand { color: #e6ecf5; font-weight: 700; text-decoration: none; font-size: 1.05rem; }
    .brand span { color: #6b8afd; }
    .langs { display: flex; gap: 6px; flex-wrap: wrap; }
    .lang { background: #131a26; color: #9fb0c8; border: 1px solid #26314a; border-radius: 8px; padding: 5px 10px; font-size: .78rem; font-weight: 600; cursor: pointer; }
    .lang:hover { color: #fff; border-color: #3a4a6e; }
    .lang.active { background: #2a3a63; border-color: #4a5f96; color: #fff; }
    main { flex: 1 0 auto; padding: 0; }
    .grid { display: grid; gap: 22px; padding: 2rem 0; }
    @media (min-width: 780px) { .grid { grid-template-columns: 380px 1fr; align-items: start; } }
    .card { background: linear-gradient(180deg, #10141d, #0d1119); border: 1px solid #1d2536; border-radius: 16px; padding: 22px; box-shadow: 0 20px 50px -30px #000; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    .lead { color: #9aa8bf; margin: 0 0 18px; font-size: .95rem; }
    .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 18px; }
    .view { width: 320px; height: 320px; overflow: hidden; border-radius: 14px; background: #0e0e12; box-shadow: inset 0 0 0 1px #26314a; }
    .view canvas { display: block; width: 320px; height: 320px; image-rendering: pixelated; }
    .timer { width: 100%; max-width: 280px; }
    .bar { height: 6px; border-radius: 99px; background: #182032; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5b7cfa, #8b5cf6); transition: width .25s linear, background .3s; }
    .bar.low span { background: linear-gradient(90deg, #f97316, #ef4444); }
    .time { margin-top: 6px; font-size: .8rem; color: #8b9ab3; text-align: center; }
    input { width: 100%; padding: 12px 14px; font-size: 1.5rem; font-weight: 600; text-align: center; letter-spacing: .4em;
        color: #eef3fb; background: #0c111a; border: 1px solid #26314a; border-radius: 12px; outline: none; }
    input:focus { border-color: #5b7cfa; box-shadow: 0 0 0 4px rgba(91,124,250,.18); }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button.act { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    .primary { background: #4f6ef7; color: #fff; }
    .primary:hover { background: #3f5be0; }
    .ghost { background: #161d2b; color: #b9c6dc; border: 1px solid #26314a; }
    .ghost:hover { background: #1d2637; color: #fff; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: .9rem; }
    .msg.err { background: #2a1620; color: #ff9db0; border: 1px solid #4a2233; }
    .msg.ok { background: #12281f; color: #7ee2b0; border: 1px solid #1f4a37; }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: #9db2ff; background: #17203a; border: 1px solid #26325a; border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
    section h2 { font-size: 1rem; margin: 0 0 8px; color: #eaf0fa; }
    section p, section li { color: #98a6bd; font-size: .9rem; line-height: 1.55; }
    section ul { padding-left: 18px; margin: 0; }
    section ul li { margin-bottom: 6px; }
    hr { height: 1px; background: #1c2433; border: 0; margin: 18px 0; }
    a { color: #8fa6ff; }
    footer { border-top: 1px solid #1c2433; background: rgba(8,10,15,.8); font-size: .82rem; color: #7c8aa3; }
    .foot-in { display: flex; justify-content: space-between; gap: 10px; padding: 14px 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
    <div class="wrap nav-in">
        <a class="brand" href="./">jevkray<span>-captcha-v3</span></a>
        <div class="langs">
            <button type="button" class="lang" data-set-lang="ru">RU</button>
            <button type="button" class="lang" data-set-lang="en">EN</button>
            <button type="button" class="lang" data-set-lang="zh">中文</button>
            <button type="button" class="lang" data-set-lang="ja">日本語</button>
            <button type="button" class="lang" data-set-lang="fr">FR</button>
            <button type="button" class="lang" data-set-lang="es">ES</button>
        </div>
    </div>
</header>

<main class="wrap">
    <div class="grid">
        <div class="card">
            <h1 data-i18n="head"></h1>
            <p class="lead" data-i18n="sub"></p>
            <div class="stage">
                <div class="view"><canvas id="cv" width="160" height="160"></canvas></div>
                <div class="timer">
                    <div class="bar" id="barwrap"><span id="bar"></span></div>
                    <div class="time"><span data-i18n="left"></span> <b id="time">30</b> <span data-i18n="sec"></span><span id="counter" style="opacity:.65"></span></div>
                </div>
            </div>
            <form id="f" autocomplete="off">
                <input id="ans" inputmode="numeric" maxlength="4" />
                <div class="actions">
                    <button type="submit" class="act primary" data-i18n="check"></button>
                    <button type="button" class="act ghost" id="newcode" data-i18n="newcode"></button>
                </div>
            </form>
            <div class="msg" id="msg" hidden></div>
        </div>

        <div>
            <span class="tag">live demo</span>
            <section>
                <h2 data-i18n="about_title"></h2>
                <p data-i18n="about_p1"></p>
                <p data-i18n="about_p2"></p>
            </section>
            <hr />
            <section>
                <h2 data-i18n="how_title"></h2>
                <ul>
                    <li data-i18n="how1"></li>
                    <li data-i18n="how2"></li>
                    <li data-i18n="how3"></li>
                    <li data-i18n="how4"></li>
                </ul>
            </section>
            <hr />
            <section>
                <h2 data-i18n="solve_title"></h2>
                <ul>
                    <li data-i18n="s1"></li>
                    <li data-i18n="s2"></li>
                    <li data-i18n="s3"></li>
                    <li data-i18n="s4"></li>
                </ul>
            </section>
            <hr />
            <section>
                <h2 data-i18n="ch_title"></h2>
                <p data-i18n="ch_p1"></p>
                <p><span data-i18n="ch_p2"></span> <a href="https://github.com/Jevkray/jevkray-captcha-v3">github.com/Jevkray/jevkray-captcha-v3</a></p>
            </section>
        </div>
    </div>
</main>

<footer><div class="wrap foot-in"><span data-i18n="footer"></span><a href="https://github.com/Jevkray">github.com/Jevkray</a></div></footer>

<script src="wwwroot/js/i18n.js"></script>
<script>
(function () {
    // ==== те же параметры, что у Rust-генератора capgen ====
    var W = 192, H = 192, AREA = 160, bx0 = (W - AREA) / 2;
    var CELL = 5, COLS = 23, ROWS = 7, BW = COLS * CELL, BH = ROWS * CELL;
    var STEP = 2, LIFE = 2.0, REVEAL_DELAY = 1.0, REVEAL_TIME = 1.5;
    var HUES = 6, SCHEMES = [[0, 25, 50, 75, 100, 125], [0, 15, 30, 180, 195, 210], [0, 20, 40, 120, 140, 160], [0, 30, 60, 90, 120, 150]];
    var PALETTE = [];
    function makePalette() {
        var base = rnd(0, 360), sch = SCHEMES[(Math.random() * SCHEMES.length) | 0];
        PALETTE = [];
        for (var i = 0; i < HUES; i++) { PALETTE.push(hsl(base + sch[i], 0.65, 0.38)); }
    }
    var BG = [14, 14, 18];
    var FONT = ["01110,10001,10011,10101,11001,10001,01110","00100,01100,00100,00100,00100,00100,01110","01110,10001,00001,00010,00100,01000,11111","11111,00010,00100,00010,00001,10001,01110","00010,00110,01010,10010,11111,00010,00010","11111,10000,11110,00001,00001,10001,01110","00110,01000,10000,11110,10001,10001,01110","11111,00001,00010,00100,01000,01000,01000","01110,10001,10001,01110,10001,10001,01110","01110,10001,10001,01111,00001,00010,01100"];

    function hsl(h, s, l) {
        h = ((h % 360) + 360) % 360; var c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60;
        var x = c * (1 - Math.abs(hp % 2 - 1)), r, g, b;
        if (hp < 1) { r = c; g = x; b = 0; } else if (hp < 2) { r = x; g = c; b = 0; }
        else if (hp < 3) { r = 0; g = c; b = x; } else if (hp < 4) { r = 0; g = x; b = c; }
        else if (hp < 5) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
        var m = l - c / 2; return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function osc(min, max, ph, w) { var mid = (min + max) / 2, half = (max - min) / 2; return { v: mid + half * Math.sin(ph *= w), ph: ph / w }; }

    var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    var img = ctx.createImageData(AREA, AREA), px = img.data;
    var code = "", mask = [], lit = [], target = 0, att = 0;
    var dots = [], bx = 0, by = 0, angText = 0, rot = 0, rotPh = 0, breathPh = 0, start = 0;

    function buildMask(c) {
        var g = [], cols = c.length * 5 + (c.length - 1);
        for (var r = 0; r < ROWS; r++) { g.push(new Array(cols).fill(0)); }
        for (var i = 0; i < c.length; i++) {
            var rows = FONT[+c[i]].split(',');
            for (var r2 = 0; r2 < ROWS; r2++) for (var cc = 0; cc < 5; cc++)
                if (rows[r2][cc] === '1') g[r2][i * 6 + cc] = 1;
        }
        return g;
    }
    function insideMask(x, y) {
        var lx = x - bx, ly = y - by;
        if (lx < 0 || ly < 0 || lx >= BW || ly >= BH) return null;
        var c = (lx / CELL) | 0, r = (ly / CELL) | 0;
        return mask[r][c] ? [c, r, lx, ly] : null;
    }
    function newDot(x, y) {
        return { x: x, y: y, vs: rnd(0.65, 1.35), va: rnd(-0.25, 0.25), sw: 1 + ((Math.random() * 2) | 0), sh: 1 + ((Math.random() * 2) | 0),
            t: Math.random(), dt: rnd(0.006, 0.02), hue: rnd(0, 360), hs: rnd(0.5, 2), g: false, gc: 0, gr: 0, fx: 0, fy: 0, ox: 0, oy: 0, dx: 0, dy: 0 };
    }
    function spawnFree(d) {
        // спавн по отрезкам вдоль направления фона: начало вектора — 40%,
        // далее 30% / 20% / 10% (чтобы у истока точек было заметно больше)
        var cos = Math.cos(bgA), sin = Math.sin(bgA);
        var c1 = cos * W, c2 = sin * H, c3 = cos * W + sin * H;
        var pmin = Math.min(0, c1, c2, c3), pmax = Math.max(0, c1, c2, c3);
        var x = rnd(0, W), y = rnd(0, H);
        for (var i = 0; i < 24; i++) {
            x = rnd(0, W); y = rnd(0, H);
            var t = (x * cos + y * sin - pmin) / (pmax - pmin || 1);
            if (Math.random() <= 1 - 0.75 * t) { break; }  // плавный градиент: начало в 4x плотнее конца
        }
        d.x = x; d.y = y;
        d.vs = rnd(0.65, 1.35); d.va = rnd(-0.25, 0.25);
        d.sw = 1 + ((Math.random() * 2) | 0); d.sh = 1 + ((Math.random() * 2) | 0);
        d.hue = rnd(0, 360); d.hs = rnd(0.5, 2);
        d.t = 0; d.dt = rnd(0.006, 0.02); d.g = false;
    }
    function reset() {
        code = "";
        for (var i = 0; i < 4; i++) code += (Math.random() * 10) | 0;
        makePalette();
        mask = buildMask(code);
        lit = [];
        for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (mask[r][c]) lit.push([c, r]);
        bx = (W - BW) / 2; by = (H - BH) / 2;
        angText = rnd(0, Math.PI * 2);
        rotPh = rnd(0, Math.PI * 2); breathPh = rnd(0, Math.PI * 2);
        dots = []; att = 0; target = 0;
        for (var gy = STEP / 2; gy < H; gy += STEP) for (var gx = STEP / 2; gx < W; gx += STEP) {
            var d = newDot(gx, gy);
            var hit = insideMask(gx, gy);
            if (hit) { d.g = true; d.gc = hit[0]; d.gr = hit[1]; d.fx = (hit[2] - hit[0] * CELL) / CELL; d.fy = (hit[3] - hit[1] * CELL) / CELL; d.ox = rnd(0, W); d.oy = rnd(0, H); target++; }
            dots.push(d);
        }
        att = target;
        target = Math.round(target * 1.5);
        dup = false;
        start = performance.now();
    }

    var vBg = 1.1, vTx = 2.6, bgA = 0, phBg = rnd(0, 6.28), phTx = rnd(0, 6.28);
    function step(dt) {
        // фон: у каждой точки свой разброс скорости и направления; надпись — жёсткое тело
        phBg += 0.006 * dt * 20; phTx += 0.006 * dt * 20;
        vBg = 1.1 + 0.3 * Math.sin(phBg);
        vTx = 2.6 + 0.6 * Math.sin(phTx);
        bgA = Math.atan2(Math.sin(phBg * 0.3) * 0.6 + 0.4, Math.cos(phBg * 0.2)) + Math.sin(phBg) * 0.5;
        var rotSpeed = 0.37, breathSpeed = 0.19;
        rotPh += 0.06 * dt; breathPh += 0.06 * dt;
        rot = Math.sin(rotPh) * 0.21;
        var gdx = Math.cos(bgA) * Math.sin(breathPh) * 2.5, gdy = Math.sin(bgA) * Math.sin(breathPh) * 2.5;
        // движение текста с отскоком в видимой зоне
        var av = angText;
        bx += Math.cos(av) * vTx * dt * 20; by += Math.sin(av) * vTx * dt * 20;
        var lo = bx0, hiX = bx0 + AREA - BW, hiY = bx0 + AREA - BH;
        if (bx < lo) { bx = lo; angText = Math.PI - angText; } else if (bx > hiX) { bx = hiX; angText = Math.PI - angText; }
        if (by < bx0) { by = bx0; angText = -angText; } else if (by > hiY) { by = hiY; angText = -angText; }
        var reveal = Math.max(0, Math.min(1, ((performance.now() - start) / 1000 - REVEAL_DELAY) / REVEAL_TIME));
        if (!dup && reveal > 0) {
            dup = true;
            var extra = [];
            for (var e = 0; e < dots.length; e++) { if (dots[e].g && Math.random() < 0.5) { extra.push(newDot(dots[e].ox, dots[e].oy)); } }
            dots = dots.concat(extra);
        }
        var cos = Math.cos(rot), sin = Math.sin(rot), rcx = bx + BW / 2, rcy = by + BH / 2;

        px.fill(0);
        for (var i = 0; i < dots.length; i++) {
            var d = dots[i];
            d.t += d.dt * dt * 20;
            if (d.t >= 1) {
                if (d.g) {
                    var lc = lit[(Math.random() * lit.length) | 0];
                    d.gc = lc[0]; d.gr = lc[1];
                    d.fx = rnd(0.1, 0.9); d.fy = rnd(0.1, 0.9);
                    d.hue = rnd(0, 360); d.hs = rnd(0.5, 2);
                    d.t = 0; d.dt = rnd(0.006, 0.02);
                } else { spawnFree(d); }
            }
            if (d.g) {
                if (reveal <= 0) { d.x += Math.cos(bgA) * vBg * dt * 20; d.y += Math.sin(bgA) * vBg * dt * 20; d.ox = d.x; d.oy = d.y; }
                else {
                    var lx = (d.gc + d.fx) * CELL - BW / 2 + gdx, ly = (d.gr + d.fy) * CELL - BH / 2 + gdy;
                    var tx = rcx + lx * cos - ly * sin, ty = rcy + lx * sin + ly * cos;
                    d.x = d.ox + (tx - d.ox) * reveal; d.y = d.oy + (ty - d.oy) * reveal;
                }
            } else {
                d.x += Math.cos(bgA + d.va) * vBg * d.vs * dt * 20; d.y += Math.sin(bgA + d.va) * vBg * d.vs * dt * 20;
                if (d.x < 0 || d.x > W || d.y < 0 || d.y > H) { spawnFree(d); }
                if (reveal >= 1 && att < target) {
                    var dx0 = d.x - rcx, dy0 = d.y - rcy;
                    var lx2 = dx0 * cos + dy0 * sin + BW / 2, ly2 = -dx0 * sin + dy0 * cos + BH / 2;
                    var hit = (lx2 >= 0 && ly2 >= 0 && lx2 < BW && ly2 < BH) ? [(lx2 / CELL) | 0, (ly2 / CELL) | 0, lx2, ly2] : null;
                    if (hit && !mask[hit[1]][hit[0]]) { hit = null; }
                    if (hit) { d.g = true; d.gc = hit[0]; d.gr = hit[1]; d.fx = (hit[2] - hit[0] * CELL) / CELL; d.fy = (hit[3] - hit[1] * CELL) / CELL; d.ox = d.x; d.oy = d.y; att++; }
                }
            }
            // цвет: у каждой точки своя медленная смена
            d.hue = (d.hue + 0.6 * d.hs * dt * 20) % 360;
            var col = PALETTE[((d.hue / 360 * HUES) | 0) % HUES];
            var x0 = Math.round(d.x) - bx0, y0 = Math.round(d.y) - bx0, sw = d.sw, sh = d.sh;
            for (var yy = 0; yy < sh; yy++) for (var xx = 0; xx < sw; xx++) {
                var pxx = x0 + xx, pyy = y0 + yy;
                if (pxx < 0 || pyy < 0 || pxx >= AREA || pyy >= AREA) continue;
                var o = (pyy * AREA + pxx) * 4;
                px[o] = col[0]; px[o + 1] = col[1]; px[o + 2] = col[2]; px[o + 3] = 255;
            }
        }
        // фон поля
        for (var k = 0; k < px.length; k += 4) { if (px[k + 3] === 0) { px[k] = BG[0]; px[k + 1] = BG[1]; px[k + 2] = BG[2]; px[k + 3] = 255; } }
        ctx.putImageData(img, 0, 0);
    }

    var last = 0, acc = 0;
    function loop(ts) { var dt = Math.min(0.1, (ts - last) / 1000 || 0.033); last = ts; acc += dt; if (acc >= 1 / 30) { step(acc); acc = 0; } requestAnimationFrame(loop); }

    // ==== интерфейс ====
    var el = function (id) { return document.getElementById(id); };
    var T = function (k) { return window.i18n ? window.i18n.t(k) : k; };
    var left = 30, timer = null;
    function paint() { el("time").textContent = Math.max(left, 0); el("bar").style.width = (Math.max(left, 0) / 30 * 100) + "%"; el("barwrap").classList.toggle("low", left <= 10); }
    function show(t, ok) { var m = el("msg"); m.hidden = !t; m.textContent = t || ""; m.className = "msg " + (ok ? "ok" : "err"); }
    function startCaptcha() { reset(); el("ans").value = ""; el("msg").hidden = true; left = 30; paint(); if (timer) clearInterval(timer); timer = setInterval(function () { left--; paint(); if (left <= 0) startCaptcha(); }, 1000); }
    el("f").addEventListener("submit", function (e) {
        e.preventDefault();
        if ((el("ans").value || "").trim() === code) { show(T("ok") + " " + code, true); }
        else { show(T("err"), false); startCaptcha(); }
    });
    el("newcode").addEventListener("click", startCaptcha);
    reset(); paint(); requestAnimationFrame(loop); startCaptcha();
})();
</script>
</body>
</html>
